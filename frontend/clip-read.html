<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3f4f6">
<title>正文快照 · SolarPanel</title>
<script>(function(){try{var d=document.documentElement;var s=localStorage.getItem('sp_theme');var t;if(s==='light'||s==='dark'){t=s}else{t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}d.dataset.theme=t;d.dataset.mode=s||'system';var st=localStorage.getItem('sp_style');if(st)d.dataset.style=st;if(localStorage.getItem('sp_rd_night')==='1')d.dataset.rdnight='1';}catch(e){}})();</script>
<link rel="stylesheet" href="/assets/css/themes.css?v=811acf3e">
<link rel="stylesheet" href="/assets/css/clip-read.css?v=817c3c9f">
</head>
<body>
<div class="style-fx" aria-hidden="true"></div>
<header class="rd-bar">
  <a class="rd-brand" href="/">SolarPanel</a>
  <a class="rd-back" href="/clips">剪藏库</a>
</header>

<main class="rd-wrap">
  <div id="rd-loading" class="rd-state">正在加载正文…</div>

  <div id="rd-error" class="rd-state error hidden">
    <p id="rd-error-msg"></p>
    <a id="rd-error-link" class="rd-btn ghost hidden" href="/login.html">去登录</a>
  </div>

  <article id="rd-article" class="hidden">
    <h1 id="rd-title"></h1>
    <p id="rd-meta" class="rd-meta"></p>
    <div id="rd-tags" class="rd-tags hidden"></div>
    <p id="rd-summary" class="rd-summary hidden"></p>
    <div id="rd-aitags" class="rd-tags rd-tags-auto hidden"></div>

    <div class="rd-tools">
      <button id="rd-star" class="rd-tool" type="button">☆ 收藏</button>
      <div class="rd-font" role="group" aria-label="字号">
        <button id="rd-font-dec" type="button" title="减小字号">A−</button>
        <button id="rd-font-reset" type="button" title="恢复默认字号">A</button>
        <button id="rd-font-inc" type="button" title="增大字号">A+</button>
      </div>
      <button id="rd-night" class="rd-tool" type="button">夜间</button>
      <button id="rd-copy" class="rd-tool" type="button">复制 Markdown</button>
      <button id="rd-print" class="rd-tool" type="button">打印 / PDF</button>
    </div>

    <div class="rd-actions">
      <a id="rd-origin" class="rd-btn" href="#" target="_blank" rel="noopener noreferrer">打开原文</a>
      <button id="rd-refetch" class="rd-btn ghost" type="button">重新抓取</button>
      <button id="rd-delete" class="rd-btn ghost" type="button">删除快照</button>
    </div>
    <p id="rd-msg" class="rd-msg" role="status"></p>

    <div id="rd-shot" class="rd-shot hidden">
      <a id="rd-shot-link" href="#" target="_blank" rel="noopener noreferrer" title="查看完整截图">
        <img id="rd-shot-img" alt="整页截图" loading="lazy">
      </a>
      <p class="rd-shot-cap"><span id="rd-shot-meta">整页截图</span> · 点击查看原图 ·
        <a id="rd-shot-dl" class="rd-shot-dl" href="#" download>下载截图</a>
      </p>
    </div>

    <div id="rd-body" class="rd-body"></div>
    <div id="rd-empty" class="rd-empty hidden">
      <p>这张卡片还没有正文快照。</p>
      <button id="rd-capture" class="rd-btn" type="button">抓取正文</button>
    </div>
  </article>
</main>

<div id="rd-lightbox" class="rd-lightbox hidden" role="dialog" aria-modal="true" aria-label="截图预览">
  <div id="rd-lb-stage" class="rd-lb-stage">
    <img id="rd-lightbox-img" alt="整页截图" draggable="false">
  </div>
  <div class="rd-lb-bar" role="toolbar" aria-label="缩放工具">
    <button id="rd-lb-out" type="button" title="缩小（-）">−</button>
    <span id="rd-lb-zoom" class="rd-lb-zoom">100%</span>
    <button id="rd-lb-in" type="button" title="放大（+）">＋</button>
    <span class="rd-lb-sep" aria-hidden="true"></span>
    <button id="rd-lb-fit" type="button" title="适应窗口（0）">适应窗口</button>
    <button id="rd-lb-actual" type="button" title="查看原始尺寸（1）">原始尺寸</button>
  </div>
  <button id="rd-lightbox-close" class="rd-lightbox-close" type="button" aria-label="关闭">×</button>
</div>

<script src="/assets/js/api.js?v=eb8254cc"></script>
<script src="/assets/js/clip-read.js?v=f32a73bb"></script>
</body>
</html>
