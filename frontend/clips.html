<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f6f7">
<title>剪藏库 · SolarPanel</title>
<script>(function(){try{var d=document.documentElement;var s=localStorage.getItem('sp_theme');var t;if(s==='light'||s==='dark'){t=s}else{t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}d.dataset.theme=t;d.dataset.mode=s||'system';var st=localStorage.getItem('sp_style');if(st)d.dataset.style=st;}catch(e){}})();</script>
<link rel="stylesheet" href="/assets/css/themes.css?v=10bab6a8">
<link rel="stylesheet" href="/assets/css/clips.css?v=62fa8c0a">
</head>
<body>
<div class="style-fx" aria-hidden="true"></div>
<header class="cl-bar">
  <div class="cl-bar-in">
    <a class="cl-brand" href="/">SolarPanel</a>
    <span class="cl-bar-title">剪藏库</span>
    <span class="cl-bar-actions">
      <a class="cl-link" href="/clip">新建剪藏</a>
      <a class="cl-link" href="/admin.html">后台</a>
    </span>
  </div>
</header>

<main class="cl-wrap">
  <section class="cl-stats" id="cl-stats">
    <button class="cl-stat" data-state="all" type="button">
      <span class="cl-stat-num" id="st-total">0</span><span class="cl-stat-lab">全部</span>
    </button>
    <button class="cl-stat" data-state="unread" type="button">
      <span class="cl-stat-num" id="st-unread">0</span><span class="cl-stat-lab">未读</span>
    </button>
    <button class="cl-stat" data-state="starred" type="button">
      <span class="cl-stat-num" id="st-starred">0</span><span class="cl-stat-lab">收藏</span>
    </button>
    <button class="cl-stat" data-kind="snapshot" type="button">
      <span class="cl-stat-num" id="st-snapshot">0</span><span class="cl-stat-lab">有正文</span>
    </button>
    <button class="cl-stat" data-kind="shot" type="button">
      <span class="cl-stat-num" id="st-shot">0</span><span class="cl-stat-lab">有截图</span>
    </button>
  </section>

  <section class="cl-toolbar">
    <div class="cl-search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.5 4a6.5 6.5 0 1 1 0 13 6.5 6.5 0 0 1 0-13Zm0 2a4.5 4.5 0 1 0 0 9 4.5 4.5 0 0 0 0-9Zm5.6 9.1 4 4-1.4 1.4-4-4Z"/></svg>
      <input id="cl-q" type="search" placeholder="搜索标题、正文、标签…（按 / 聚焦）" autocomplete="off">
      <button id="cl-q-clear" class="cl-q-clear hidden" type="button" title="清空">×</button>
    </div>

    <div class="cl-filters">
      <div class="cl-tabs" id="cl-tabs">
        <button class="cl-tab active" data-kind="" type="button">全部</button>
        <button class="cl-tab" data-kind="snapshot" type="button">正文</button>
        <button class="cl-tab" data-kind="shot" type="button">截图</button>
        <button class="cl-tab" data-kind="card" type="button">仅卡片</button>
        <button class="cl-tab" data-kind="failed" type="button">抓取失败</button>
      </div>
      <div class="cl-selects">
        <select id="cl-group" class="cl-select" aria-label="按分组筛选"><option value="0">全部分组</option></select>
        <select id="cl-sort" class="cl-select" aria-label="排序">
          <option value="newest">最新收藏</option>
          <option value="updated">最近更新</option>
          <option value="words">字数最多</option>
          <option value="shot">优先截图</option>
          <option value="title">标题排序</option>
          <option value="oldest">最早收藏</option>
        </select>
        <div class="cl-view" id="cl-view">
          <button data-view="grid" class="active" type="button" title="网格视图">▦</button>
          <button data-view="list" type="button" title="列表视图">☰</button>
        </div>
      </div>
    </div>

    <div class="cl-tagbar hidden" id="cl-tagbar"></div>
  </section>

  <div id="cl-status" class="cl-status"></div>
  <div id="cl-list" class="cl-list grid"></div>
  <div id="cl-empty" class="cl-empty hidden">
    <p class="cl-empty-title">还没有匹配的剪藏</p>
    <p class="cl-empty-sub">用浏览器扩展、快捷指令或 <a href="/clip">剪藏页</a> 保存第一条内容。</p>
  </div>
  <div class="cl-more">
    <button id="cl-more" class="cl-btn hidden" type="button">加载更多</button>
  </div>
</main>

<script src="/assets/js/api.js?v=46f3e6de"></script>
<script src="/assets/js/clips.js?v=f3d91b8c"></script>
</body>
</html>
