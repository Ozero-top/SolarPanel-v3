<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>保存到 SolarPanel</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="head">
  <span class="brand">
    <span class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
        <rect x="3" y="6" width="18" height="12" rx="2.4"/>
        <path d="M9 6v12M15 6v12M3 12h18"/>
      </svg>
    </span>
    SolarPanel
  </span>
  <div class="head-nav">
    <a id="openHome" class="nav-link" href="#" target="_blank" rel="noopener">主页</a>
    <a id="openClips" class="nav-link" href="#" target="_blank" rel="noopener">剪藏库</a>
    <a id="openOptions" class="nav-link" href="options.html" target="_blank">设置</a>
  </div>
</div>

<div id="setupView" class="hidden">
  <p class="hint">首次使用需要填写服务器地址与个人 Token。</p>
  <button id="setupBtn" class="btn">打开设置</button>
</div>

<div id="mainView" class="hidden">
  <div class="tabs" role="tablist">
    <button id="tabBtnSave" class="tab active" type="button" role="tab">保存当前页</button>
    <button id="tabBtnLib" class="tab" type="button" role="tab">最近剪藏</button>
  </div>

  <div id="tabSave" class="tab-pane">
    <div id="statusBar" class="status"></div>

    <div id="formFields" class="panel">
      <label class="field">
        <span>标题</span>
        <input id="fTitle" type="text" maxlength="200" placeholder="页面标题">
      </label>
      <div class="url" id="fUrl"></div>
      <div class="field-row">
        <label class="field">
          <span>分组</span>
          <select id="fGroup"></select>
        </label>
        <label class="field">
          <span>截图方式</span>
          <select id="fShotMode">
            <option value="full">整页（滚动拼接）</option>
            <option value="viewport">仅可视区</option>
            <option value="none">不截图</option>
          </select>
        </label>
      </div>
      <label class="field">
        <span>标签（可选）</span>
        <input id="fTags" type="text" maxlength="200" placeholder="技术, 设计">
      </label>
      <label class="field">
        <span>备注（可选）</span>
        <textarea id="fNote" rows="2" maxlength="500" placeholder="记录为什么保存它"></textarea>
      </label>
      <label class="check">
        <input id="fSnapshot" type="checkbox"> 同时保存正文快照
      </label>
    </div>

    <div id="dupBox" class="alert hidden">
      <span class="alert-text">该链接已存在。</span>
      <span class="alert-actions">
        <button id="updateShotBtn" type="button">更新已有卡片截图</button>
        <button id="forceBtn" type="button">仍要另存</button>
      </span>
    </div>

    <button id="saveBtn" class="btn save-btn" type="button">保存到 SolarPanel</button>

    <div id="doneBox" class="panel done hidden">
      <div class="actions">
        <a id="openRead" class="btn" href="#" target="_blank" rel="noopener">在剪藏库查看</a>
        <a id="openPage" class="btn ghost" href="#" target="_blank">打开原文</a>
      </div>
      <div class="actions">
        <button id="starBtn" class="btn ghost" type="button">☆ 收藏</button>
        <button id="readBtn" class="btn ghost" type="button">标记未读</button>
        <button id="refetchBtn" class="btn ghost" type="button">重新抓取正文</button>
        <button id="delSnapBtn" class="btn ghost" type="button">删除快照</button>
      </div>
      <div class="actions auto">
        <button id="retryShotBtn" class="btn ghost hidden" type="button">重试截图</button>
        <button id="undoBtn" class="btn ghost danger" type="button">撤销</button>
      </div>
    </div>
  </div>

  <div id="tabLib" class="tab-pane hidden">
    <section class="lib">
      <div class="lib-head">
        <span>最近剪藏</span>
        <a id="libAll" class="link" href="#" target="_blank" rel="noopener">全部 →</a>
      </div>
      <input id="libQ" class="lib-q" type="search" placeholder="搜索剪藏（标题 / 正文 / 标签）">
      <ul id="libList" class="lib-list"></ul>
    </section>
  </div>

  <div class="foot">
    <span class="kbd-tip" title="可在 chrome://extensions/shortcuts 查看或修改">快捷键 <kbd>Alt+Shift+S</kbd></span>
    <span id="ver"></span>
  </div>
  <details class="shortcut-tip">
    <summary>快捷键无响应？</summary>
    <p>与输入法冲突（如 Alt+Shift 切换语言）时，可在「设置 → 快捷键」改绑，例如 <code>Ctrl+Shift+Y</code>。</p>
  </details>
</div>

<script src="popup.js"></script>
</body>
</html>
